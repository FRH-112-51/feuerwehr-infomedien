<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feuerwehr Infomedien Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
    
    .a4-preview {
      width: 210mm;
      min-height: 297mm;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // PASSWORT-EINSTELLUNG
    const ACCESS_PASSWORD = "51FRH112";

    function App() {
      // Auth State
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      const [authError, setAuthError] = useState(false);

      // App State
      const [activeTab, setActiveTab] = useState('omw');
      const [logoUrl, setLogoUrl] = useState(null);
      
      // Header State
      const [titel, setTitel] = useState('MONATS-INFO');
      const [stichwort, setStichwort] = useState('EINSATZUPDATE & INFOS');
      
      // Newsletter State
      const [articles, setArticles] = useState([
        { 
          id: 1, 
          title: 'Erfolgreiche Großübung absolviert', 
          category: 'Übungsdienst', 
          text: 'Am vergangenen Samstag fand unsere jährliche Hauptübung statt. Schwerpunkte waren die Brandbekämpfung sowie die Menschenrettung unter schwerem Atemschutz.', 
          image: null 
        }
      ]);
      const [sidebarInfo, setSidebarInfo] = useState({
        einsaetze: '14',
        uebungen: '4',
        termine: '15.11. - Dienstversammlung\n28.11. - Wettausbildung'
      });

      // One Minute Wonder State (Inkl. Grafiken & variabler Boxenanzahl)
      const [omwTitle, setOmwTitle] = useState('Motorkettensäge im Feuerwehrdienst');
      const [omwSub, setOmwSub] = useState('SICHERHEIT & EINSATZTAKTIK');
      const [generatingGraphicId, setGeneratingGraphicId] = useState(null);
      
      const [omwBoxes, setOmwBoxes] = useState([
        { 
          id: 1, 
          title: 'Persönliche Schutzausrüstung', 
          text: 'Schnittschutzhose (Klasse 1), Helm mit Gesichtsschutz und Gehörschutz sind zwingend erforderlich.', 
          image: 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=400&q=80' 
        },
        { 
          id: 2, 
          title: 'Einsatzbereich', 
          text: 'Beseitigung von Sturmschäden, Dachteile öffnen bei Brandeinsätzen, THL-Einsätze.', 
          image: null 
        },
        { 
          id: 3, 
          title: 'Sicherheitszonen', 
          text: 'Im Gefahrenbereich von 2x Baumlänge darf sich nur der Sägeführer und der Helfer aufhalten.', 
          image: null 
        }
      ]);

      // Login Handler
      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === ACCESS_PASSWORD) {
          setIsAuthenticated(true);
          setAuthError(false);
        } else {
          setAuthError(true);
        }
      };

      // Logo Handle
      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) setLogoUrl(URL.createObjectURL(file));
      };

      // Newsletter Steuerung
      const addArticle = () => {
        setArticles([...articles, { id: Date.now(), title: 'Neuer Beitrag', category: 'Allgemein', text: 'Inhalt hier eingeben...', image: null }]);
      };

      const updateArticle = (id, field, value) => {
        setArticles(articles.map(a => a.id === id ? { ...a, [field]: value } : a));
      };

      const removeArticle = (id) => {
        if (articles.length > 1) setArticles(articles.filter(a => a.id !== id));
      };

      // OMW Boxen Steuerung (Variable Anzahl)
      const addOmwBox = () => {
        setOmwBoxes([...omwBoxes, { id: Date.now(), title: `Infobox ${omwBoxes.length + 1}`, text: 'Inhalt / Fakten hier eingeben...', image: null }]);
      };

      const removeOmwBox = (id) => {
        if (omwBoxes.length > 1) setOmwBoxes(omwBoxes.filter(b => b.id !== id));
      };

      const updateOmwBox = (id, field, value) => {
        setOmwBoxes(omwBoxes.map(b => b.id === id ? { ...b, [field]: value } : b));
      };

      const handleBoxImageUpload = (id, e) => {
        const file = e.target.files[0];
        if (file) updateOmwBox(id, 'image', URL.createObjectURL(file));
      };

      // KI Grafik-Generierung Simulation (Erstellt passende Schema-Grafik)
      const generateAiGraphic = (id, promptText) => {
        setGeneratingGraphicId(id);
        
        setTimeout(() => {
          // Generiert eine hochauflösende Feuerwehr-/Technik-Illustration basierend auf Unsplash Source
          const sampleImages = [
            'https://images.unsplash.com/photo-1583863788434-e58a36330cf0?auto=format&fit=crop&w=500&q=80',
            'https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&fit=crop&w=500&q=80',
            'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=500&q=80',
            'https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=500&q=80'
          ];
          const randomImg = sampleImages[Math.floor(Math.random() * sampleImages.length)];
          
          updateOmwBox(id, 'image', randomImg);
          setGeneratingGraphicId(null);
        }, 1500);
      };

      // ANMELDEBILDSCHIRM
      if (!isAuthenticated) {
        return (
          <div class="min-h-screen bg-gray-950 flex items-center justify-center p-4">
            <form onSubmit={handleLogin} class="bg-gray-900 border border-gray-800 p-8 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
              <div class="text-center">
                <i class="fa-solid fa-shield-halved text-4xl text-red-600 mb-3"></i>
                <h2 class="text-xl font-bold text-white">Geschützter Bereich</h2>
                <p class="text-xs text-gray-400 mt-1">Freiwillige Feuerwehr Reithofen-Harthofen</p>
              </div>
              <div>
                <label class="text-xs text-gray-400 block mb-1">Passwort eingeben</label>
                <input 
                  type="password" 
                  placeholder="Passwort..." 
                  value={passwordInput} 
                  onChange={(e) => setPasswordInput(e.target.value)}
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white text-center tracking-widest focus
