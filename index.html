<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feuerwehr Infomedien Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
    
    .a4-preview {
      width: 210mm;
      min-height: 297mm;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('newsletter');
      const [logoUrl, setLogoUrl] = useState(null);
      const [stichwort, setStichwort] = useState('EINSATZUPDATE & INFOS');
      const [titel, setTitel] = useState('MONATS-INFO');
      
      // Newsletter State
      const [articles, setArticles] = useState([
        { id: 1, title: 'Erfolgreiche Großübung absolviert', category: 'Übungsdienst', text: 'Am vergangenen Samstag fand unsere jährliche Hauptübung statt. Schwerpunkte waren die Brandbekämpfung sowie die Menschenrettung unter schwerem Atemschutz.', images: [] }
      ]);
      const [sidebarInfo, setSidebarInfo] = useState({
        einsaetze: '14',
        uebungen: '4',
        termine: '15.11. - Dienstversammlung\n28.11. - Wettausbildung'
      });

      // One Minute Wonder State
      const [omwTitle, setOmwTitle] = useState('Motorkettensäge im Feuerwehrdienst');
      const [omwSub, setOmwSub] = useState('SICHERHEIT & EINSATZTAKTIK');
      const [omwBoxes, setOmwBoxes] = useState([
        { id: 1, title: 'Persönliche Schutzausrüstung', text: 'Schnittschutzhose (Klasse 1), Helm mit Gesichtsschutz und Gehörschutz sind zwingend erforderlich.', image: null },
        { id: 2, title: 'Einsatzbereich', text: 'Beseitigung von Sturmschäden, Dachteile öffnen bei Brandeinsätzen, THL-Einsätze.', image: null },
        { id: 3, title: 'Sicherheitszonen', text: 'Im Gefahrenbereich von 2x Baumlänge darf sich nur der Sägeführer und der Helfer aufhalten.', image: null }
      ]);

      // Logo Handle
      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setLogoUrl(URL.createObjectURL(file));
        }
      };

      // Articles Management
      const addArticle = () => {
        setArticles([
          ...articles,
          { id: Date.now(), title: 'Neuer Beitrag', category: 'Allgemein', text: 'Inhalt des Beitrags hier eingeben...', images: [] }
        ]);
      };

      const updateArticle = (id, field, value) => {
        setArticles(articles.map(a => a.id === id ? { ...a, [field]: value } : a));
      };

      const removeArticle = (id) => {
        if (articles.length > 1) {
          setArticles(articles.filter(a => a.id !== id));
        }
      };

      // Print
      const handlePrint = () => {
        window.print();
      };

      return (
        <div class="flex h-screen overflow-hidden">
          {/* LEFT SIDEBAR / EDITOR */}
          <div class="w-1/2 p-6 overflow-y-auto border-r border-gray-800 bg-gray-950 no-print">
            <div class="flex items-center justify-between mb-6 border-b border-gray-800 pb-4">
              <h1 class="text-xl font-bold text-red-500 flex items-center gap-2">
                <i class="fa-solid fa-fire-extinguisher"></i> Feuerwehr Infomedien Studio
              </h1>
              <button onClick={handlePrint} class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition">
                <i class="fa-solid fa-print"></i> PDF Drucken
              </button>
            </div>

            {/* Global Settings */}
            <div class="bg-gray-900 p-4 rounded-xl mb-6 border border-gray-800 space-y-3">
              <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Allgemeine Einstellungen</h2>
              <div>
                <label class="text-xs text-gray-400 block mb-1">Vereins-Logo hochladen</label>
                <input type="file" accept="image/*" onChange={handleLogoUpload} class="text-xs text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-red-950 file:text-red-400 hover:file:bg-red-900 cursor-pointer" />
              </div>
            </div>

            {/* Tabs Selector */}
            <div class="flex gap-2 mb-6">
              <button 
                onClick={() => setActiveTab('newsletter')}
                class={`flex-1 py-3 rounded-lg font-bold transition flex items-center justify-center gap-2 ${activeTab === 'newsletter' ? 'bg-red-600 text-white' : 'bg-gray-900 text-gray-400 hover:bg-gray-800'}`}>
                <i class="fa-solid fa-newspaper"></i> Newsletter
              </button>
              <button 
                onClick={() => setActiveTab('omw')}
                class={`flex-1 py-3 rounded-lg font-bold transition flex items-center justify-center gap-2 ${activeTab === 'omw' ? 'bg-red-600 text-white' : 'bg-gray-900 text-gray-400 hover:bg-gray-800'}`}>
                <i class="fa-solid fa-bolt"></i> One Minute Wonder
              </button>
            </div>
