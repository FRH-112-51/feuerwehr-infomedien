<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feuerwehr Infomedien Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
    
    .a4-preview {
      width: 210mm;
      min-height: 297mm;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Speichert bearbeitbare Inhalte automatisch im lokalen Browser-Speicher.
    function usePersistentState(key, initialValue, deserialize) {
      const [value, setValue] = React.useState(() => {
        try {
          const stored = localStorage.getItem(key);
          if (stored !== null) {
            const parsed = JSON.parse(stored);
            return deserialize ? deserialize(parsed) : parsed;
          }
        } catch (error) {
          console.warn('Lokale Daten konnten nicht gelesen werden:', error);
        }
        return typeof initialValue === 'function' ? initialValue() : initialValue;
      });

      React.useEffect(() => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (error) {
          console.warn('Lokale Speicherung fehlgeschlagen (möglicherweise Speicherlimit erreicht):', error);
        }
      }, [key, value]);

      return [value, setValue];
    }

    // Bilder werden als Data-URL gespeichert, damit sie nach einem Neuladen erhalten bleiben.
    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    function App() {
      const [activeTab, setActiveTab] = usePersistentState('ffstudio_activeTab', 'newsletter');
      const [logoUrl, setLogoUrl] = usePersistentState('ffstudio_logoUrl', null);
      const [stichwort, setStichwort] = usePersistentState('ffstudio_stichwort', 'EINSATZUPDATE & INFOS');
      const [titel, setTitel] = usePersistentState('ffstudio_titel', 'MONATS-INFO');
      
      // Newsletter State
      const [articles, setArticles] = usePersistentState('ffstudio_articles', [
        { id: 1, title: 'Erfolgreiche Großübung absolviert', category: 'Übungsdienst', text: 'Am vergangenen Samstag fand unsere jährliche Hauptübung statt...', image: null }
      ]);
      const [sidebarInfo, setSidebarInfo] = usePersistentState('ffstudio_sidebarInfo', {
        einsaetze: '14',
        uebungen: '4',
        termine: '15.11. - Dienstversammlung\n28.11. - Wettausbildung'
      });

      // One Minute Wonder State
      const [omwTitle, setOmwTitle] = usePersistentState('ffstudio_omwTitle', 'Motorkettensäge im Feuerwehrdienst');
      const [omwSub, setOmwSub] = usePersistentState('ffstudio_omwSub', 'SICHERHEIT & EINSATZTAKTIK');
      const [omwBoxes, setOmwBoxes] = usePersistentState('ffstudio_omwBoxes', [
        { id: 1, title: 'Persönliche Schutzausrüstung', text: 'Schnittschutzhose (Klasse 1), Helm mit Gesichtsschutz und Gehörschutz sind zwingend erforderlich.', image: null },
        { id: 2, title: 'Einsatzbereich', text: 'Beseitigung von Sturmschäden, Dachteile öffnen bei Brandeinsätzen, THL-Einsätze.', image: null },
        { id: 3, title: 'Sicherheitszonen', text: 'Im Gefahrenbereich von 2x Baumlänge darf sich nur der Sägeführer und der Helfer aufhalten.', image: null }
      ]);

      // Übungsplan State
      const [planTitle, setPlanTitle] = usePersistentState('ffstudio_planTitle', 'ÜBUNGSPLAN');
      const [planSub, setPlanSub] = usePersistentState('ffstudio_planSub', 'MONATSRÜBERSICHT');
      const gruppenList = [
        'Gruppe 1', 'Gruppe 2', 'Gruppe 3', 'Jugendfeuerwehr',
        'FB Atemschutz', 'FB First Responder', 'FB ERHT', 'FB Maschinisten',
        'Alle', 'Führungskräfte Aktiv'
      ];
      const [uebungen, setUebungen] = usePersistentState('ffstudio_uebungen', [
        { id: 1, datum: '12.11.2026', gruppen: ['Gruppe 1'], thema: 'Brandbekämpfung Innenangriff', zeit: '19:30 - 21:30', leiter: 'H. Huber' },
        { id: 2, datum: '19.11.2026', gruppen: ['Jugendfeuerwehr'], thema: 'Fahrzeug- und Gerätekunde', zeit: '19:30 - 21:30', leiter: 'M. Maier' },
        { id: 3, datum: '26.11.2026', gruppen: ['FB Atemschutz'], thema: 'Belastungsübung & Streckengang', zeit: '19:30 - 21:30', leiter: 'A. Bauer' }
      ]);
      const [calendarDate, setCalendarDate] = usePersistentState('ffstudio_calendarDate', new Date(2026, 10, 1), value => new Date(value));
      const [editingUebung, setEditingUebung] = useState(null);
      const [isNewUebung, setIsNewUebung] = useState(false);

      // Logo Handle
      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          readFileAsDataUrl(file).then(setLogoUrl).catch(error => console.error('Logo konnte nicht geladen werden:', error));
        }
      };

      // Article Controls Newsletter
      const addArticle = () => {
        setArticles([...articles, {
          id: Date.now(),
          title: 'Neuer Beitrag',
          category: 'Allgemein',
          text: 'Hier den Text des Beitrags eingeben...',
          image: null
        }]);
      };

      const removeArticle = (id) => {
        if (articles.length > 1) {
          setArticles(articles.filter(art => art.id !== id));
        }
      };

      const updateArticle = (id, field, value) => {
        setArticles(articles.map(art => art.id === id ? { ...art, [field]: value } : art));
      };

      const handleArticleImageUpload = (id, e) => {
        const file = e.target.files[0];
        if (file) {
          readFileAsDataUrl(file).then(dataUrl => updateArticle(id, 'image', dataUrl)).catch(error => console.error('Bild konnte nicht geladen werden:', error));
        }
      };

      // Box Controls OMW
      const addOmwBox = () => {
        setOmwBoxes([...omwBoxes, { id: Date.now(), title: `Infobox ${omwBoxes.length + 1}`, text: 'Beschreibungstext hier eingeben...', image: null }]);
      };

      const removeOmwBox = (id) => {
        if (omwBoxes.length > 1) {
          setOmwBoxes(omwBoxes.filter(box => box.id !== id));
        }
      };

      const updateOmwBox = (id, field, value) => {
        setOmwBoxes(omwBoxes.map(b => b.id === id ? { ...b, [field]: value } : b));
      };

      const handleBoxImageUpload = (id, e) => {
        const file = e.target.files[0];
        if (file) {
          readFileAsDataUrl(file).then(dataUrl => updateOmwBox(id, 'image', dataUrl)).catch(error => console.error('Bild konnte nicht geladen werden:', error));
        }
      };

      // Übungsplan / Monatskalender Controls
      const toIsoDate = (date) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };

      const toGermanDate = (isoDate) => {
        const [y, m, d] = isoDate.split('-');
        return `${d}.${m}.${y}`;
      };

      const toIsoFromGerman = (germanDate) => {
        const [d, m, y] = germanDate.split('.');
        return `${y}-${m}-${d}`;
      };

      const groupColor = (gruppe) => {
        if (['Gruppe 1', 'Gruppe 2', 'Gruppe 3'].includes(gruppe)) return '#2563eb';
        if (['FB Atemschutz', 'FB First Responder', 'FB ERHT', 'FB Maschinisten'].includes(gruppe)) return '#16a34a';
        if (gruppe === 'Alle') return '#dc2626';
        if (gruppe === 'Jugendfeuerwehr') return '#f97316';
        if (gruppe === 'Führungskräfte Aktiv') return '#eab308';
        return '#6b7280';
      };

      const openNewUebung = (isoDate) => {
        setIsNewUebung(true);
        setEditingUebung({
          id: Date.now(),
          datum: toGermanDate(isoDate),
          gruppen: ['Alle'],
          thema: '',
          zeit: '19:30 - 21:30',
          leiter: ''
        });
      };

      const openEditUebung = (uebung) => {
        setIsNewUebung(false);
        setEditingUebung({
          ...uebung,
          gruppen: Array.isArray(uebung.gruppen) ? [...uebung.gruppen] : (uebung.gruppe ? [uebung.gruppe] : [])
        });
      };

      const saveUebung = () => {
        if (!editingUebung || !editingUebung.datum || editingUebung.gruppen.length === 0) return;
        if (isNewUebung) {
          setUebungen([...uebungen, editingUebung]);
        } else {
          setUebungen(uebungen.map(u => u.id === editingUebung.id ? editingUebung : u));
        }
        setEditingUebung(null);
      };

      const deleteEditingUebung = () => {
        if (!editingUebung) return;
        setUebungen(uebungen.filter(u => u.id !== editingUebung.id));
        setEditingUebung(null);
      };

      const moveUebungToDate = (id, isoDate) => {
        setUebungen(uebungen.map(u => u.id === id ? { ...u, datum: toGermanDate(isoDate) } : u));
      };

      const changeCalendarMonth = (offset) => {
        setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() + offset, 1));
      };

      const calendarDays = (() => {
        const firstDay = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), 1);
        const mondayOffset = (firstDay.getDay() + 6) % 7;
        const startDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), 1 - mondayOffset);
        return Array.from({ length: 42 }, (_, i) => {
          const day = new Date(startDate);
          day.setDate(startDate.getDate() + i);
          return day;
        });
      })();

      // Print
      const handlePrint = () => {
        window.print();
      };

      return (
        <div class="flex h-screen overflow-hidden">
          {/* LEFT SIDEBAR / EDITOR */}
          <div class="w-1/2 p-6 overflow-y-auto border-r border-gray-800 bg-gray-950 no-print">
            <div class="flex items-center justify-between mb-6 border-b border-gray-800 pb-4">
              <h1 class="text-xl font-bold text-red-500 flex items-center gap-2">
                <i class="fa-solid fa-fire-extinguisher"></i> Infomedien Studio
              </h1>
              <button onClick={handlePrint} class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition">
                <i class="fa-solid fa-print"></i> PDF Drucken
              </button>
            </div>

            {/* Global Settings */}
            <div class="bg-gray-900 p-4 rounded-xl mb-6 border border-gray-800 space-y-3">
              <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Allgemeine Einstellungen</h2>
              <div>
                <label class="text-xs text-gray-400 block mb-1">Vereins-Logo hochladen</label>
                <input type="file" accept="image/*" onChange={handleLogoUpload} class="text-xs text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-red-950 file:text-red-400 hover:file:bg-red-900 cursor-pointer" />
              </div>
            </div>

            {/* Tabs Selector */}
            <div class="flex gap-2 mb-6">
              <button 
                onClick={() => setActiveTab('newsletter')}
                class={`flex-1 py-3 rounded-lg font-bold transition flex items-center justify-center gap-1.5 text-xs ${activeTab === 'newsletter' ? 'bg-red-600 text-white' : 'bg-gray-900 text-gray-400 hover:bg-gray-800'}`}>
                <i class="fa-solid fa-newspaper"></i> Newsletter
              </button>
              <button 
                onClick={() => setActiveTab('omw')}
                class={`flex-1 py-3 rounded-lg font-bold transition flex items-center justify-center gap-1.5 text-xs ${activeTab === 'omw' ? 'bg-red-600 text-white' : 'bg-gray-900 text-gray-400 hover:bg-gray-800'}`}>
                <i class="fa-solid fa-bolt"></i> One Min.
              </button>
              <button 
                onClick={() => setActiveTab('plan')}
                class={`flex-1 py-3 rounded-lg font-bold transition flex items-center justify-center gap-1.5 text-xs ${activeTab === 'plan' ? 'bg-red-600 text-white' : 'bg-gray-900 text-gray-400 hover:bg-gray-800'}`}>
                <i class="fa-solid fa-calendar-days"></i> Übungsplan
              </button>
            </div>

            {/* TAB: NEWSLETTER */}
            {activeTab === 'newsletter' && (
              <div class="space-y-4">
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                  <h3 class="font-semibold text-red-400">Header-Konfiguration</h3>
                  <div>
                    <label class="text-xs text-gray-400">Haupt-Titel (Schwarz in Vorschau)</label>
                    <input type="text" value={titel} onChange={(e) => setTitel(e.target.value)} class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm mt-1" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-400">Stichwort / Untertitel (Rot in Vorschau)</label>
                    <input type="text" value={stichwort} onChange={(e) => setStichwort(e.target.value)} class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm mt-1" />
                  </div>
                </div>

                {/* Newsletter Articles Controls */}
                <div class="space-y-3">
                  <div class="flex justify-between items-center">
                    <h3 class="font-semibold text-gray-300">Beiträge verwalten ({articles.length})</h3>
                    <button onClick={addArticle} class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded font-semibold flex items-center gap-1">
                      <i class="fa-solid fa-plus"></i> Beitrag hinzufügen
                    </button>
                  </div>

                  {articles.map((art, idx) => (
                    <div key={art.id} class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2 relative">
                      <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-bold text-red-500">Beitrag #{idx + 1}</span>
                        {articles.length > 1 && (
                          <button onClick={() => removeArticle(art.id)} class="text-gray-500 hover:text-red-400 text-xs">
                            <i class="fa-solid fa-trash"></i> Löschen
                          </button>
                        )}
                      </div>
                      <div class="grid grid-cols-3 gap-2">
                        <div class="col-span-1">
                          <label class="text-xs text-gray-400 block mb-1">Kategorie</label>
                          <input 
                            type="text" 
                            value={art.category} 
                            onChange={(e) => updateArticle(art.id, 'category', e.target.value)} 
                            class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-xs" 
                          />
                        </div>
                        <div class="col-span-2">
                          <label class="text-xs text-gray-400 block mb-1">Titel</label>
                          <input 
                            type="text" 
                            value={art.title} 
                            onChange={(e) => updateArticle(art.id, 'title', e.target.value)} 
                            class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-xs font-semibold" 
                          />
                        </div>
                      </div>
                      <div>
                        <label class="text-xs text-gray-400 block mb-1">Inhalt</label>
                        <textarea 
                          rows="3" 
                          value={art.text} 
                          onChange={(e) => updateArticle(art.id, 'text', e.target.value)} 
                          class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-xs"
                        ></textarea>
                      </div>
                      <div>
                        <label class="text-xs text-gray-400 block mb-1">Bild für diesen Beitrag</label>
                        <input 
                          type="file" 
                          accept="image/*" 
                          onChange={(e) => handleArticleImageUpload(art.id, e)} 
                          class="text-xs text-gray-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:bg-gray-800 file:text-gray-300 hover:file:bg-gray-700 cursor-pointer" 
                        />
                      </div>
                    </div>
                  ))}
                </div>

                {/* Sidebar Stats Box */}
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                  <h3 class="font-semibold text-red-400">Rechte Infobox (Statistik & Termine)</h3>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="text-xs text-gray-400">Einsätze</label>
                      <input type="text" value={sidebarInfo.einsaetze} onChange={(e) => setSidebarInfo({...sidebarInfo, einsaetze: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm" />
                    </div>
                    <div>
                      <label class="text-xs text-gray-400">Übungen</label>
                      <input type="text" value={sidebarInfo.uebungen} onChange={(e) => setSidebarInfo({...sidebarInfo, uebungen: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm" />
                    </div>
                  </div>
                  <div>
                    <label class="text-xs text-gray-400">Termine / Hinweise</label>
                    <textarea rows="3" value={sidebarInfo.termine} onChange={(e) => setSidebarInfo({...sidebarInfo, termine: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm mt-1"></textarea>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: ONE MINUTE WONDER */}
            {activeTab === 'omw' && (
              <div class="space-y-4">
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                  <h3 class="font-semibold text-red-400">One Minute Wonder Header</h3>
                  <div>
                    <label class="text-xs text-gray-400">Thema / Haupt-Titel (Schwarz in Vorschau)</label>
                    <input type="text" value={omwTitle} onChange={(e) => setOmwTitle(e.target.value)} class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm mt-1" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-400">Stichwort / Untertitel (Rot in Vorschau)</label>
                    <input type="text" value={omwSub} onChange={(e) => setOmwSub(e.target.value)} class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm mt-1" />
                  </div>
                </div>

                {/* Dynamic Boxes */}
                <div class="space-y-3">
                  <div class="flex justify-between items-center">
                    <h3 class="font-semibold text-gray-300">Infoboxen ({omwBoxes.length})</h3>
                    <button onClick={addOmwBox} class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded font-semibold flex items-center gap-1">
                      <i class="fa-solid fa-plus"></i> Box hinzufügen
                    </button>
                  </div>

                  {omwBoxes.map((box, idx) => (
                    <div key={box.id} class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2 relative">
                      <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-bold text-red-500">Box #{idx + 1}</span>
                        {omwBoxes.length > 1 && (
                          <button onClick={() => removeOmwBox(box.id)} class="text-gray-500 hover:text-red-400 text-xs">
                            <i class="fa-solid fa-trash"></i> Löschen
                          </button>
                        )}
                      </div>
                      <input 
                        type="text" 
                        value={box.title} 
                        onChange={(e) => updateOmwBox(box.id, 'title', e.target.value)}
                        placeholder="Titel der Infobox" 
                        class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm font-semibold" 
                      />
                      <textarea 
                        rows="2" 
                        value={box.text} 
                        onChange={(e) => updateOmwBox(box.id, 'text', e.target.value)}
                        placeholder="Inhalt / Fakten..." 
                        class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-xs"
                      ></textarea>
                      <div>
                        <label class="text-xs text-gray-400 block mb-1">Grafik / Bild für diese Box</label>
                        <input 
                          type="file" 
                          accept="image/*" 
                          onChange={(e) => handleBoxImageUpload(box.id, e)} 
                          class="text-xs text-gray-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:bg-gray-800 file:text-gray-300 hover:file:bg-gray-700 cursor-pointer" 
                        />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: ÜBUNGSPLAN */}
            {activeTab === 'plan' && (
              <div class="space-y-4">
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                  <h3 class="font-semibold text-red-400">Kalender-Einstellungen</h3>
                  <div>
                    <label class="text-xs text-gray-400">Haupt-Titel</label>
                    <input type="text" value={planTitle} onChange={(e) => setPlanTitle(e.target.value)} class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm mt-1" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-400">Stichwort / Untertitel</label>
                    <input type="text" value={planSub} onChange={(e) => setPlanSub(e.target.value)} class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm mt-1" />
                  </div>
                </div>

                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                  <div class="flex items-center justify-between gap-2">
                    <button onClick={() => changeCalendarMonth(-1)} class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded" aria-label="Vorheriger Monat">
                      <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <h3 class="font-bold text-white text-lg capitalize">
                      {calendarDate.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })}
                    </h3>
                    <button onClick={() => changeCalendarMonth(1)} class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded" aria-label="Nächster Monat">
                      <i class="fa-solid fa-chevron-right"></i>
                    </button>
                  </div>
                  <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-gray-400">
                    {['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(tag => <div key={tag} class="py-2">{tag}</div>)}
                  </div>
                  <div class="grid grid-cols-7 gap-1">
                    {calendarDays.map((day) => {
                      const isoDate = toIsoDate(day);
                      const dayEvents = uebungen.filter(u => toIsoFromGerman(u.datum) === isoDate);
                      const inMonth = day.getMonth() === calendarDate.getMonth();
                      return (
                        <div
                          key={isoDate}
                          onDragOver={(e) => e.preventDefault()}
                          onDrop={(e) => {
                            e.preventDefault();
                            const eventId = Number(e.dataTransfer.getData('text/plain'));
                            if (eventId) moveUebungToDate(eventId, isoDate);
                          }}
                          onClick={() => openNewUebung(isoDate)}
                          class={`min-h-[112px] p-1 rounded border cursor-pointer transition ${inMonth ? 'bg-gray-800 border-gray-700 hover:border-red-500' : 'bg-gray-950 border-gray-800 opacity-50'}`}
                        >
                          <div class="text-xs text-gray-300 font-semibold mb-1">{day.getDate()}</div>
                          <div class="space-y-1">
                            {dayEvents.map(event => (
                              <div
                                key={event.id}
                                draggable="true"
                                onDragStart={(e) => {
                                  e.stopPropagation();
                                  e.dataTransfer.setData('text/plain', String(event.id));
                                  e.dataTransfer.effectAllowed = 'move';
                                }}
                                onClick={(e) => {
                                  e.stopPropagation();
                                  openEditUebung(event);
                                }}
                                class="rounded px-1.5 py-1 bg-gray-950 border border-gray-700 text-left text-[10px] text-white cursor-grab active:cursor-grabbing"
                                title={`${event.thema} – ${event.gruppen.join(', ')}`}
                              >
                                <div class="flex gap-0.5 mb-1">
                                  {event.gruppen.map(g => (
                                    <span key={g} class="h-1.5 flex-1 rounded" style={{ backgroundColor: groupColor(g) }}></span>
                                  ))}
                                </div>
                                <div class="font-bold leading-tight">{event.zeit}</div>
                                <div class="leading-tight">{event.thema || 'Neuer Termin'}</div>
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  <div class="flex flex-wrap gap-x-3 gap-y-2 pt-2 text-[10px] text-gray-300">
                    {[
                      ['Gruppe 1–3', '#2563eb'], ['FB', '#16a34a'], ['Alle', '#dc2626'],
                      ['Jugend', '#f97316'], ['Führungskräfte Aktiv', '#eab308']
                    ].map(([label, color]) => (
                      <span key={label} class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm" style={{ backgroundColor: color }}></span>{label}</span>
                    ))}
                  </div>
                  <p class="text-[10px] text-gray-500">Tipp: Termin auf einen anderen Kalendertag ziehen. Durch Anklicken eines freien Tages wird ein neuer Termin angelegt.</p>
                </div>
              </div>
            )}

            {editingUebung && (
              <div class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4 no-print" onClick={() => setEditingUebung(null)}>
                <div class="w-full max-w-lg bg-gray-900 border border-gray-700 rounded-xl p-5 space-y-3 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                  <div class="flex items-center justify-between">
                    <h3 class="font-bold text-white text-lg">{isNewUebung ? 'Neuen Übungstermin erstellen' : 'Übungstermin bearbeiten'}</h3>
                    <button onClick={() => setEditingUebung(null)} class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                  </div>
                  <div>
                    <label class="text-xs text-gray-400">Datum</label>
                    <input type="text" value={editingUebung.datum} onChange={(e) => setEditingUebung({ ...editingUebung, datum: e.target.value })} placeholder="TT.MM.JJJJ" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm mt-1 text-white" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-400 block mb-2">Übungsgruppen (Mehrfachauswahl)</label>
                    <div class="grid grid-cols-2 gap-2">
                      {gruppenList.map(g => (
                        <label key={g} class="flex items-center gap-2 text-sm text-gray-200 bg-gray-800 rounded p-2">
                          <input
                            type="checkbox"
                            checked={editingUebung.gruppen.includes(g)}
                            onChange={(e) => setEditingUebung({
                              ...editingUebung,
                              gruppen: e.target.checked
                                ? [...editingUebung.gruppen, g]
                                : editingUebung.gruppen.filter(item => item !== g)
                            })}
                          />
                          <span class="w-2.5 h-2.5 rounded-sm" style={{ backgroundColor: groupColor(g) }}></span>
                          {g}
                        </label>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label class="text-xs text-gray-400">Thema</label>
                    <input type="text" value={editingUebung.thema} onChange={(e) => setEditingUebung({ ...editingUebung, thema: e.target.value })} class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm mt-1 text-white" />
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="text-xs text-gray-400">Uhrzeit</label>
                      <input type="text" value={editingUebung.zeit} onChange={(e) => setEditingUebung({ ...editingUebung, zeit: e.target.value })} class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm mt-1 text-white" />
                    </div>
                    <div>
                      <label class="text-xs text-gray-400">Übungsleiter</label>
                      <input type="text" value={editingUebung.leiter} onChange={(e) => setEditingUebung({ ...editingUebung, leiter: e.target.value })} class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm mt-1 text-white" />
                    </div>
                  </div>
                  <div class="flex justify-between gap-2 pt-2">
                    {!isNewUebung && <button onClick={deleteEditingUebung} class="text-red-400 hover:text-red-300 text-sm px-3 py-2">Termin löschen</button>}
                    <div class="flex gap-2 ml-auto">
                      <button onClick={() => setEditingUebung(null)} class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded text-sm">Abbrechen</button>
                      <button onClick={saveUebung} disabled={editingUebung.gruppen.length === 0} class="bg-red-600 hover:bg-red-700 disabled:opacity-40 text-white px-4 py-2 rounded text-sm font-semibold">Speichern</button>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* RIGHT SIDEBAR / LIVE A4 PREVIEW */}
          <div class="w-1/2 bg-gray-800 p-8 overflow-y-auto flex justify-center items-start">
            <div id="print-area" class="a4-preview bg-white text-gray-900 p-6 flex flex-col justify-between">
              <div>
                {/* BRANDING HEADER WITH INTEGRATED LOGO */}
                <div class="mb-6">
                  <div class="bg-[#C80000] text-white px-5 py-4 rounded flex justify-between items-center min-h-[90px]">
                    <div class="flex flex-col justify-center">
                      <span class="font-normal tracking-wider text-xl uppercase">FREIWILLIGE FEUERWEHR REITHOFEN-HARTHOFEN</span>
                      <span class="text-xs opacity-80 mt-1">{new Date().toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })}</span>
                    </div>
                    
                    {/* INTEGRATED LOGO AREA */}
                    <div class="w-16 h-16 flex items-center justify-center border-2 border-dashed border-white/50 rounded bg-white/10 overflow-hidden flex-shrink-0 ml-4">
                      {logoUrl ? (
                        <img src={logoUrl} alt="Logo" class="w-full h-full object-contain p-1" />
                      ) : (
                        <span class="text-[9px] text-white font-semibold text-center leading-tight opacity-90">LOGO<br/>HIER</span>
                      )}
                    </div>
                  </div>

                  <div class="mt-4 px-1">
                    {activeTab === 'newsletter' && (
                      <>
                        <h1 class="text-3xl font-extrabold text-black tracking-tight uppercase">{titel}</h1>
                        <p class="text-[#C80000] font-bold text-sm tracking-widest mt-0.5">{stichwort}</p>
                      </>
                    )}
                    {activeTab === 'omw' && (
                      <>
                        <h1 class="text-3xl font-extrabold text-black tracking-tight uppercase">{omwTitle}</h1>
                        <p class="text-[#C80000] font-bold text-sm tracking-widest mt-0.5">{omwSub}</p>
                      </>
                    )}
                    {activeTab === 'plan' && (
                      <>
                        <h1 class="text-3xl font-extrabold text-black tracking-tight uppercase">{planTitle}</h1>
                        <p class="text-[#C80000] font-bold text-sm tracking-widest mt-0.5">{planSub}</p>
                      </>
                    )}
                  </div>
                </div>

                {/* CONTENT AREA: NEWSLETTER */}
                {activeTab === 'newsletter' && (
                  <div class="grid grid-cols-3 gap-6">
                    <div class="col-span-2 space-y-4">
                      {articles.map((art) => (
                        <div key={art.id} class="border-2 border-gray-200 rounded-lg p-3 bg-white shadow-sm flex flex-col justify-between">
                          <div>
                            <span class="text-[10px] font-bold bg-red-100 text-[#C80000] px-2 py-0.5 rounded uppercase">{art.category}</span>
                            <h2 class="text-lg font-bold text-gray-900 mt-1">{art.title}</h2>
                            <p class="text-xs text-gray-700 leading-relaxed mt-2 whitespace-pre-line">{art.text}</p>
                          </div>
                          {art.image && (
                            <div class="mt-3 h-32 w-full rounded overflow-hidden border border-gray-200">
                              <img src={art.image} class="w-full h-full object-cover" />
                            </div>
                          )}
                        </div>
                      ))}
                    </div>

                    {/* SIDEBAR BOX */}
                    <div class="col-span-1 space-y-4">
                      <div class="bg-gray-50 p-4 rounded-lg border-l-4 border-[#C80000] shadow-sm">
                        <h3 class="font-bold text-xs text-gray-900 uppercase tracking-wider mb-2 border-b pb-1">Statistik Monat</h3>
                        <div class="space-y-1 text-xs">
                          <div class="flex justify-between"><span>Einsätze:</span> <strong class="text-[#C80000]">{sidebarInfo.einsaetze}</strong></div>
                          <div class="flex justify-between"><span>Übungen:</span> <strong>{sidebarInfo.uebungen}</strong></div>
                        </div>
                      </div>

                      <div class="bg-gray-50 p-4 rounded-lg border-l-4 border-gray-800 shadow-sm">
                        <h3 class="font-bold text-xs text-gray-900 uppercase tracking-wider mb-2 border-b pb-1">Termine</h3>
                        <p class="text-[11px] text-gray-700 whitespace-pre-line leading-relaxed">{sidebarInfo.termine}</p>
                      </div>
                    </div>
                  </div>
                )}

                {/* CONTENT AREA: ONE MINUTE WONDER */}
                {activeTab === 'omw' && (
                  <div class="space-y-4">
                    <div class={`grid gap-4 ${omwBoxes.length === 1 ? 'grid-cols-1' : omwBoxes.length === 2 ? 'grid-cols-2' : 'grid-cols-2'}`}>
                      {omwBoxes.map((box, i) => (
                        <div key={box.id} class="border-2 border-gray-200 rounded-lg p-3 bg-white shadow-sm flex flex-col justify-between">
                          <div>
                            <div class="flex items-center gap-2 mb-2">
                              <span class="w-5 h-5 rounded-full bg-[#C80000] text-white flex items-center justify-center text-xs font-bold">{i + 1}</span>
                              <h3 class="font-bold text-sm text-gray-900">{box.title}</h3>
                            </div>
                            <p class="text-xs text-gray-600 leading-relaxed">{box.text}</p>
                          </div>
                          {box.image && (
                            <div class="mt-3 h-28 w-full rounded overflow-hidden border border-gray-200">
                              <img src={box.image} class="w-full h-full object-cover" />
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* CONTENT AREA: ÜBUNGSPLAN */}
                {activeTab === 'plan' && (
                  <div class="space-y-3">
                    <div class="flex items-center justify-between border-b-2 border-gray-200 pb-2">
                      <h2 class="font-bold text-gray-800 capitalize">{calendarDate.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })}</h2>
                      <span class="text-xs text-gray-500">{uebungen.filter(u => {
                        const d = toIsoFromGerman(u.datum);
                        return d.startsWith(`${calendarDate.getFullYear()}-${String(calendarDate.getMonth()+1).padStart(2,'0')}`);
                      }).length} Termine</span>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center text-[9px] font-bold text-gray-500">
                      {['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(tag => <div key={tag} class="py-1">{tag}</div>)}
                    </div>
                    <div class="grid grid-cols-7 gap-1">
                      {calendarDays.map(day => {
                        const isoDate = toIsoDate(day);
                        const dayEvents = uebungen.filter(u => toIsoFromGerman(u.datum) === isoDate);
                        return (
                          <div key={isoDate} class={`min-h-[82px] border border-gray-200 rounded p-1 ${day.getMonth() === calendarDate.getMonth() ? 'bg-white' : 'bg-gray-50 text-gray-300'}`}>
                            <div class="text-[9px] font-semibold mb-1">{day.getDate()}</div>
                            {dayEvents.map(event => (
                              <div key={event.id} class="mb-1 rounded-sm border border-gray-200 p-1">
                                <div class="flex gap-px mb-0.5">{event.gruppen.map(g => <span key={g} class="h-1 flex-1" style={{ backgroundColor: groupColor(g) }}></span>)}</div>
                                <div class="text-[7px] font-bold leading-tight">{event.zeit}</div>
                                <div class="text-[7px] leading-tight">{event.thema}</div>
                              </div>
                            ))}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>

              {/* FOOTER */}
              <div class="border-t border-gray-200 pt-3 flex justify-between items-center text-[10px] text-gray-400">
                <span>Freiwillige Feuerwehr Reithofen-Harthofen</span>
                <span>Seite 1</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
