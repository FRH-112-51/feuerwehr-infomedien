<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feuerwehr Infomedien Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
    
    .a4-preview {
      width: 210mm;
      min-height: 297mm;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // PASSWORT-EINSTELLUNG
    const ACCESS_PASSWORD = "51FRH112";

    function App() {
      // Auth State
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      const [authError, setAuthError] = useState(false);

      // App State
      const [activeTab, setActiveTab] = useState('newsletter');
      const [logoUrl, setLogoUrl] = useState(null);
      
      // Header State
      const [titel, setTitel] = useState('MONATS-INFO');
      const [stichwort, setStichwort] = useState('EINSATZUPDATE & INFOS');
      
      // Newsletter State
      const [articles, setArticles] = useState([
        { 
          id: 1, 
          title: 'Erfolgreiche Großübung absolviert', 
          category: 'Übungsdienst', 
          text: 'Am vergangenen Samstag fand unsere jährliche Hauptübung statt. Schwerpunkte waren die Brandbekämpfung sowie die Menschenrettung unter schwerem Atemschutz.' 
        }
      ]);
      const [sidebarInfo, setSidebarInfo] = useState({
        einsaetze: '14',
        uebungen: '4',
        termine: '15.11. - Dienstversammlung\n28.11. - Wettausbildung'
      });

      // One Minute Wonder State
      const [omwTitle, setOmwTitle] = useState('Motorkettensäge im Feuerwehrdienst');
      const [omwSub, setOmwSub] = useState('SICHERHEIT & EINSATZTAKTIK');
      const [generatingGraphicId, setGeneratingGraphicId] = useState(null);
      
      const [omwBoxes, setOmwBoxes] = useState([
        { 
          id: 1, 
          title: 'Persönliche Schutzausrüstung', 
          text: 'Schnittschutzhose (Klasse 1), Helm mit Gesichtsschutz und Gehörschutz sind zwingend erforderlich.', 
          image: null 
        },
        { 
          id: 2, 
          title: 'Einsatzbereich', 
          text: 'Beseitigung von Sturmschäden, Dachteile öffnen bei Brandeinsätzen, THL-Einsätze.', 
          image: null 
        },
        { 
          id: 3, 
          title: 'Sicherheitszonen', 
          text: 'Im Gefahrenbereich von 2x Baumlänge darf sich nur der Sägeführer und der Helfer aufhalten.', 
          image: null 
        }
      ]);

      // Login Handler
      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput.trim() === ACCESS_PASSWORD) {
          setIsAuthenticated(true);
          setAuthError(false);
        } else {
          setAuthError(true);
        }
      };

      // Logo Handle
      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) setLogoUrl(URL.createObjectURL(file));
      };

      // Newsletter Steuerung
      const addArticle = () => {
        setArticles([...articles, { id: Date.now(), title: 'Neuer Beitrag', category: 'Allgemein', text: 'Inhalt hier eingeben...' }]);
      };

      const updateArticle = (id, field, value) => {
        setArticles(articles.map(a => a.id === id ? { ...a, [field]: value } : a));
      };

      const removeArticle = (id) => {
        if (articles.length > 1) setArticles(articles.filter(a => a.id !== id));
      };

      // OMW Boxen Steuerung
      const addOmwBox = () => {
        setOmwBoxes([...omwBoxes, { id: Date.now(), title: `Infobox ${omwBoxes.length + 1}`, text: 'Inhalt / Fakten hier eingeben...', image: null }]);
      };

      const removeOmwBox = (id) => {
        if (omwBoxes.length > 1) setOmwBoxes(omwBoxes.filter(b => b.id !== id));
      };

      const updateOmwBox = (id, field, value) => {
        setOmwBoxes(omwBoxes.map(b => b.id === id ? { ...b, [field]: value } : b));
      };

      const handleBoxImageUpload = (id, e) => {
        const file = e.target.files[0];
        if (file) updateOmwBox(id, 'image', URL.createObjectURL(file));
      };

      // KI Grafik-Generierung
      const generateAiGraphic = (id) => {
        setGeneratingGraphicId(id);
        setTimeout(() => {
          const sampleImages = [
            'https://images.unsplash.com/photo-1583863788434-e58a36330cf0?auto=format&fit=crop&w=500&q=80',
            'https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&fit=crop&w=500&q=80',
            'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=500&q=80'
          ];
          const randomImg = sampleImages[Math.floor(Math.random() * sampleImages.length)];
          updateOmwBox(id, 'image', randomImg);
          setGeneratingGraphicId(null);
        }, 1200);
      };

      // ANMELDEBILDSCHIRM
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-gray-950 flex items-center justify-center p-4">
            <form onSubmit={handleLogin} className="bg-gray-900 border border-gray-800 p-8 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
              <div className="text-center">
                <i className="fa-solid fa-shield-halved text-4xl text-red-600 mb-3"></i>
                <h2 className="text-xl font-bold text-white">Geschützter Bereich</h2>
                <p className="text-xs text-gray-400 mt-1">Freiwillige Feuerwehr Reithofen-Harthofen</p>
              </div>
              <div>
                <label className="text-xs text-gray-400 block mb-1">Passwort eingeben</label>
                <input 
                  type="password" 
                  placeholder="Passwort..." 
                  value={passwordInput} 
                  onChange={(e) => setPasswordInput(e.target.value)}
                  className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white text-center tracking-widest focus:outline-none focus:border-red-600"
                  autoFocus
                />
                {authError && <p className="text-red-500 text-xs mt-2 text-center font-semibold">Falsches Passwort!</p>}
              </div>
              <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition">
                Anmelden
              </button>
            </form>
          </div>
        );
      }

      // HAUPTANWENDUNG
      return (
        <div className="flex h-screen overflow-hidden">
          {/* EDITOR (LINKS) */}
          <div className="w-1/2 p-6 overflow-y-auto border-r border-gray-800 bg-gray-950 no-print">
            <div className="flex items-center justify-between mb-6 border-b border-gray-800 pb-4">
              <h1 className="text-xl font-bold text-red-500 flex items-center gap-2">
                <i className="fa-solid fa-fire-extinguisher"></i> Feuerwehr Infomedien Studio
              </h1>
              <button onClick={() => window.print()} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition">
                <i className="fa-solid fa-print"></i> PDF Drucken
              </button>
            </div>

            {/* Logo Upload */}
            <div className="bg-gray-900 p-4 rounded-xl mb-6 border border-gray-800">
              <label className="text-xs text-gray-400 block mb-1">Vereins-Logo hochladen</label>
              <input type="file" accept="image/*" onChange={handleLogoUpload} className="text-xs text-gray-300 cursor-pointer" />
            </div>

            {/* Tabs Selector */}
            <div className="flex gap-2 mb-6">
              <button 
                onClick={() => setActiveTab('newsletter')}
                className={`flex-1 py-3 rounded-lg font-bold transition flex items-center justify-center gap-2 ${activeTab === 'newsletter' ? 'bg-red-600 text-white' : 'bg-gray-900 text-gray-400 hover:bg-gray-800'}`}>
                <i className="fa-solid fa-newspaper"></i> Newsletter
              </button>
              <button 
                onClick={() => setActiveTab('omw')}
                className={`flex-1 py-3 rounded-lg font-bold transition flex items-center justify-center gap-2 ${activeTab === 'omw' ? 'bg-red-600 text-white' : 'bg-gray-900 text-gray-400 hover:bg-gray-800'}`}>
                <i className="fa-solid fa-bolt"></i> One Minute Wonder
              </button>
            </div>

            {/* TAB: NEWSLETTER */}
            {activeTab === 'newsletter' && (
              <div className="space-y-6">
                <div className="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                  <h3 className="font-semibold text-red-400 text-sm">Header-Konfiguration</h3>
                  <input type="text" value={titel} onChange={(e) => setTitel(e.target.value)} placeholder="Haupttitel" className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm" />
                  <input type="text" value={stichwort} onChange={(e) => setStichwort(e.target.value)} placeholder="Stichwort (Rot)" className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm" />
                </div>

                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="font-semibold text-gray-300">Beiträge ({articles.length})</h3>
                    <button onClick={addArticle} className="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded font-semibold flex items-center gap-1">
                      <i className="fa-solid fa-plus"></i> Beitrag hinzufügen
                    </button>
                  </div>

                  {articles.map((art, idx) => (
                    <div key={art.id} className="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-bold text-red-500">Beitrag #{idx + 1}</span>
                        {articles.length > 1 && (
                          <button onClick={() => removeArticle(art.id)} className="text-gray-500 hover:text-red-400 text-xs">
                            <i className="fa-solid fa-trash"></i> Löschen
                          </button>
                        )}
                      </div>
                      <input type="text" value={art.category} onChange={(e) => updateArticle(art.id, 'category', e.target.value)} placeholder="Kategorie" className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-xs font-semibold text-red-400" />
                      <input type="text" value={art.title} onChange={(e) => updateArticle(art.id, 'title', e.target.value)} placeholder="Überschrift" className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm font-bold" />
                      <textarea rows="3" value={art.text} onChange={(e) => updateArticle(art.id, 'text', e.target.value)} placeholder="Inhalt..." className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-xs"></textarea>
                    </div>
                  ))}
                </div>

                <div className="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                  <h3 className="font-semibold text-red-400 text-sm">Rechte Infobox (Statistik & Termine)</h3>
                  <div className="grid grid-cols-2 gap-2">
                    <input type="text" value={sidebarInfo.einsaetze} onChange={(e) => setSidebarInfo({...sidebarInfo, einsaetze: e.target.value})} placeholder="Einsätze" className="bg-gray-800 border border-gray-700 rounded p-2 text-xs" />
                    <input type="text" value={sidebarInfo.uebungen} onChange={(e) => setSidebarInfo({...sidebarInfo, uebungen: e.target.value})} placeholder="Übungen" className="bg-gray-800 border border-gray-700 rounded p-2 text-xs" />
                  </div>
                  <textarea rows="3" value={sidebarInfo.termine} onChange={(e) => setSidebarInfo({...sidebarInfo, termine: e.target.value})} placeholder="Termine..." className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-xs"></textarea>
                </div>
              </div>
            )}

            {/* TAB: ONE MINUTE WONDER */}
            {activeTab === 'omw' && (
              <div className="space-y-6">
                <div className="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                  <h3 className="font-semibold text-red-400 text-sm">One Minute Wonder Header</h3>
                  <input type="text" value={omwTitle} onChange={(e) => setOmwTitle(e.target.value)} placeholder="Thema / Haupttitel" className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm font-bold" />
                  <input type="text" value={omwSub} onChange={(e) => setOmwSub(e.target.value)} placeholder="Untertitel / Kategorie" className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-xs text-red-400 font-semibold" />
                </div>

                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="font-semibold text-gray-300">Infoboxen ({omwBoxes.length})</h3>
                    <button onClick={addOmwBox} className="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded font-semibold flex items-center gap-1">
                      <i className="fa-solid fa-plus"></i> Box hinzufügen
                    </button>
                  </div>

                  {omwBoxes.map((box, idx) => (
                    <div key={box.id} className="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-bold text-red-500">Box #{idx + 1}</span>
                        {omwBoxes.length > 1 && (
                          <button onClick={() => removeOmwBox(box.id)} className="text-gray-500 hover:text-red-400 text-xs">
                            <i className="fa-solid fa-trash"></i> Löschen
                          </button>
                        )}
                      </div>
                      <input type
